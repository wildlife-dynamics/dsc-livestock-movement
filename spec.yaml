id: dsc_livestock_movement
requirements:
- name: ecoscope-platform
  version: ==2.27.1
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-distance-sample-counts
  version: ==1.1.5.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Groupers
  id: groupers
  task: set_groupers
  partial:
    groupers: null
    
- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Get Events
  id: events
  task: get_events
  partial:
    time_range: ${{ workflow.time_range.return }}
    client: ${{ workflow.er_connection.return }}
    event_types:
    - livestock_block_movement
    include_display_values: true
    include_details: true
    event_columns:
    - id
    - time
    - event_type
    - event_category
    - title
    - reported_by
    - created_at
    - serial_number
    - is_collection
    - event_details
    - geometry
    event_states: null
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    force_point_geometry: true

- name: Process Events Details
  id: events_details
  task: process_events_details
  partial:
    df: ${{ workflow.events.return }}
    client: ${{ workflow.er_connection.return }}
    map_to_titles: true
    ordered: true

- name: Normalize Json Column
  id: json_column
  task: normalize_json_column
  partial:
    df: ${{ workflow.events_details.return }}
    column: event_details
    sort_columns: true
    skip_if_not_exists: true

- name: Drop Column Prefix
  id: column_prefix
  task: drop_column_prefix
  partial:
    df: ${{ workflow.json_column.return }}
    duplicate_strategy: suffix
    prefix: event_details__

- name: Decompose Datetime
  id: datetime
  task: decompose_datetime
  partial:
    df: ${{ workflow.column_prefix.return }}
    datetime_column: time
    components:
    - date
    remove_source: false
    column_prefix: null

- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.datetime.return }}
    rename_columns:
      time_date: date
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Validate Block Movements
  id: block_movements
  task: validate_block_movements
  partial:
    df: ${{ workflow.columns.return }}

- name: Map Columns
  id: rename_block_movements
  task: map_columns
  partial:
    df: ${{ workflow.block_movements.return }}
    retain_columns:
    - serial_number
    - prev_serial
    - date
    - prev_date
    - FROM
    - TO
    - Community/Zone
    - status
    - is_issue
    rename_columns:
      FROM: From
      TO: To
      status: Status
      date: Date
      prev_date: Previous Date
      prev_serial: Previous Serial Number
      serial_number: Serial Number
    drop_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Persist Dataframe
  id: persist_block_movements
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.rename_block_movements.return }}
    filename: livestock_movement_validation
    filetype: csv

- name: Draw Table
  id: draw_block_movement_table
  task: draw_table
  partial:
    dataframe: ${{ workflow.rename_block_movements.return }}
    columns: null
    table_config: null

- name: Persist Text
  id: persist_block_movement_table
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.draw_block_movement_table.return }}

- name: Create Table Widget Single View
  id: table_movement_widget_view
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    data: ${{ workflow.persist_block_movement_table.return }}
    title: Livestock Movement Validation

- name: Merge Widget Views
  id: merged_table_movement_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.table_movement_widget_view.return }}

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets: ${{ workflow.merged_table_movement_views.return }}
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: null
